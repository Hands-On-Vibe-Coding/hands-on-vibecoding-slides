<h2 id="%EA%B0%80%EB%B8%8C%EB%A6%AC%EC%97%98-%ED%94%BC%ED%84%B0%EC%8A%A8%EC%9D%98-ai-driven-study">가브리엘 피터슨의 AI Driven Study</h2>
<blockquote>
<p>OpenAI 연구원. 고등학교 중퇴 후 독학으로 개발자가 됨.</p>

<p><strong>핵심 원리 6가지</strong></p>
<ol>
<li><strong>현실 문제에서 시작</strong>한다 (bottom-up이 아닌 problem-first)</li>
<li><strong>재귀적 갭 메우기</strong>: 만든다 → 막힌다 → 묻는다 → 다시 만든다</li>
<li><strong>아하 모먼트</strong>를 자주 만들도록 프롬프트를 최적화</li>

<li><strong>사람 피드백 + AI 피드백</strong>을 둘 다 활용한다</li>
</ol>
